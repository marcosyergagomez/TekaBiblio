groups:
  - name: tekabiblio-api-alerts
    interval: 1m
    rules:
      - alert: TekaBiblioHighAuthFailures
        expr: sum(rate(tekabiblio_auth_failures_total[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High authentication failure rate"
          description: "Auth failures are above baseline for 10 minutes. Investigate brute force attempts or auth regressions."

      - alert: TekaBiblioHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(tekabiblio_http_request_duration_seconds_bucket[5m])) by (le)) > 1.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API latency p95"
          description: "p95 latency has been above 1.2s for 10 minutes."
