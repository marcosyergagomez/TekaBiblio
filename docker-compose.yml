name: tekabiblio
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  pma:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PMA_PORT}"   
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${API_PORT}:3000"     
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["sh", "-lc", "corepack enable && pnpm install && pnpm run dev"]

  web:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${WEB_PORT}:5173"     
    env_file:
      - ./apps/web/.env
    environment:
      NODE_ENV: development
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    command: ["sh", "-lc", "corepack enable && pnpm install && pnpm run dev -- --host 0.0.0.0 --port ${WEB_PORT}"]

volumes:
  mysql_data:
  redis_data:
  api_node_modules:
  web_node_modules: