name: tekabiblio
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tekabiblio}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/api/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  pma:
    image: phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

  api:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      DB_NAME: ${MYSQL_DATABASE:-tekabiblio}
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-lc", "corepack enable && pnpm install && pnpm run dev"]

  web:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:${API_PORT:-3000}
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    command: ["sh", "-lc", "corepack enable && pnpm install && pnpm run dev -- --host 0.0.0.0 --port ${WEB_PORT:-5173}"]

volumes:
  mysql_data:
  api_node_modules:
  web_node_modules: